name: Validate research release
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU runtime and package
        run: |
          pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[dev]'
      - name: Static checks
        run: ruff check src scripts tests
      - name: Unit tests (no weight download)
        run: pytest -m 'not weights'
      - name: Check public files for accidental credentials
        run: python scripts/check_release.py
