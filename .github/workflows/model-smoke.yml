name: Optional checkpoint smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[dev]'
      - name: Verify and exercise the pinned checkpoint
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "from retvim.inference import download_weights; print(download_weights())" > weights-path.txt
          RETVIM_TEST_WEIGHTS="$(cat weights-path.txt)" pytest tests/test_inference.py -m weights
