[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "retvim"
version = "1.0.0"
description = "RetViM retinal OCT research: checkpoint-faithful ViT and Mamba inference"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "LICENSES.md", "NOTICE"]
authors = [{name = "Khamir Desai"}]
dependencies = [
  "torch>=2.6,<3", "torchvision>=0.21,<1", "timm>=1.0.22,<1.1",
  "safetensors>=0.5,<1", "huggingface-hub>=0.34,<2", "Pillow>=11,<13",
  "numpy>=1.26,<3", "opencv-python-headless>=4.10,<5"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
eval = ["scikit-learn>=1.5,<2"]

[project.scripts]
retvim = "retvim.cli:main"

[project.urls]
Repository = "https://github.com/khamirdesai/RetViM"
Model = "https://huggingface.co/khamirdesai/RetViM"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["weights: requires RETVIM_TEST_WEIGHTS to point to the real release weights"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
